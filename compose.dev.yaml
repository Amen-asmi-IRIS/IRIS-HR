# Development overrides: images built locally with the test tools, source mounted, ports open.

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: ./backend
      target: dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    restart: unless-stopped

  web:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://app:8000
      # The dev server polls the mounted Windows folder for changes. With the usual four threads those
      # file checks hold up everything else it does, the forwarding of /api calls first.
      UV_THREADPOOL_SIZE: 64
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
