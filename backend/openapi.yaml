            $ref: '#/components/schemas/OutPersonOut'
        delegation:
          allOf:
          - $ref: '#/components/schemas/DelegationLineOut'
          nullable: true
        people:
          type: array
          items:
            $ref: '#/components/schemas/TeamPersonOut'
      required:
      - delegation
      - people
      - who_is_out
    TeamPersonOut:
      type: object
      properties:
        public_id:
          type: string
        today:
          $ref: '#/components/schemas/PresenceEnum'
        waiting:
          type: boolean
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
      required:
      - balance
      - public_id
      - today
      - waiting
    TeammateAwayOut:
      type: object
      properties:
        name:
          type: string
        label:
          $ref: '#/components/schemas/CalendarLabelEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - label
      - name
      - start_date
    TemporaryPasswordOut:
      type: object
      properties:
        temporary_password:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - temporary_password
    UnreadCountOut:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    UsageOut:
      type: object
      properties:
        cap:
          allOf:
          - $ref: '#/components/schemas/CapUsageOut'
          nullable: true
        month_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
          nullable: true
        event_days_allowed:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
          nullable: true
      required:
      - cap
      - event_days_allowed
      - month_hours
    VersionInRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required:
      - version
    ViewerRelationEnum:
      enum:
      - owner
      - approver
      - team
      - hr
      - overview
      type: string
      description: |-
        * `owner` - owner
        * `approver` - approver
        * `team` - team
        * `hr` - hr
        * `overview` - overview
    WaitingLineOut:
      type: object
      properties:
        request_public_id:
          type: string
        employee_name:
          type: string
        type_name:
          type: string
        waiting_on:
          type: array
          items:
            type: string
        since:
          type: string
          format: date-time
          nullable: true
      required:
      - employee_name
      - request_public_id
      - since
      - type_name
      - waiting_on
    WorkspaceEnum:
      enum:
      - me
      - team
      - hr
      - overview
      - admin
      type: string
      description: |-
        * `me` - me
        * `team` - team
        * `hr` - hr
        * `overview` - overview
        * `admin` - admin
    WorkspaceSummaryOut:
      type: object
      properties:
        me:
          type: integer
        team:
          type: integer
        hr:
          type: integer
        overview:
          type: integer
        admin:
          type: integer
      required:
      - admin
      - hr
      - me
      - overview
      - team
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
