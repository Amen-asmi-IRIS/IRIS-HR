      operationId: audit_security_export
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: object_id
        schema:
          type: string
          minLength: 1
      - in: query
        name: object_type
        schema:
          type: string
          minLength: 1
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -action
          - -at
          - action
          - at
        description: Sort order; `-at` when absent. A leading minus sign means descending.
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - audit
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: 'Called once when the web app starts: sets the csrftoken cookie
        that unsafe calls must echo.'
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfOut'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
    patch:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMePatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMePatchInRequest'
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/auth/password:
