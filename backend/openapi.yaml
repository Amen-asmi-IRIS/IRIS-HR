  /api/v1/departments:
    get:
      operationId: departments_list
      tags:
      - departments
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentOut'
          description: ''
    post:
      operationId: departments_create
      tags:
