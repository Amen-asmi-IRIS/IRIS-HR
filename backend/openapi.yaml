          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentOut'
          description: ''
  /api/v1/employees:
    get:
      operationId: employees_list
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: manager
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - -name
          - employee_number
          - -employee_number
          - hire_date
          - -hire_date
          type: string
          minLength: 1
        description: |-
          * `name` - name
          * `-name` - -name
          * `employee_number` - employee_number
          * `-employee_number` - -employee_number
          * `hire_date` - hire_date
          * `-hire_date` - -hire_date
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: 25 by default, 100 at most.'
      - in: query
        name: scope
        schema:
          enum:
          - team
          - all
          type: string
          minLength: 1
        description: |-
          * `team` - team
          * `all` - all
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          enum:
          - active
          - suspended
          - archived
          - all
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `suspended` - suspended
          * `archived` - archived
          * `all` - all
      tags:
      - employees
      security:
