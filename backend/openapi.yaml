  /api/v1/calendar:
    get:
      operationId: calendar_feed
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: employee
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: scope
        schema:
          enum:
          - department
          - team
          - company
          type: string
          minLength: 1
        description: |-
          * `department` - department
          * `team` - team
          * `company` - company
        required: true
      - in: query
        name: status
        schema:
          enum:
          - pending
          - approved
          type: string
          minLength: 1
        description: |-
          * `pending` - pending
          * `approved` - approved
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: type
        schema:
          type: string
          minLength: 1
          maxLength: 50
      tags:
      - calendar
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarOut'
          description: ''
  /api/v1/delegations:
    get:
      operationId: delegations_list
      parameters:
      - in: query
        name: manager
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -end_date
          - -start_date
          - end_date
          - start_date
        description: Sort order; `-start_date` when absent. A leading minus sign means
          descending.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: 25 by default, 100 at most.'
      - in: query
        name: scope
        schema:
          enum:
          - mine
          - all
          type: string
          minLength: 1
        description: |-
          * `mine` - mine
          * `all` - all
      tags:
      - delegations
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDelegationOut'
          description: ''
    post:
      operationId: delegations_create
      tags:
      - delegations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationInRequest'
          multipart/form-data:
            schema:
