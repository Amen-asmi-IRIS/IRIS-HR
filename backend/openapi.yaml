        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordInRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '204':
          description: No response body
  /api/v1/balances/{employee_public_id}:
    get:
      operationId: balances_figures
      parameters:
      - in: path
        name: employee_public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: 'on'
        schema:
          type: string
          format: date
      tags:
      - balances
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceOut'
          description: ''
  /api/v1/balances/{employee_public_id}/adjustments:
    post:
      operationId: balances_adjust
      parameters:
      - in: path
        name: employee_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - balances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdjustmentInRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerLineOut'
          description: ''
  /api/v1/balances/{employee_public_id}/ledger:
    get:
      operationId: balances_ledger
      parameters:
      - in: path
        name: employee_public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -date
          - date
        description: Sort order; `-date` when absent. A leading minus sign means descending.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: 25 by default, 100 at most.'
