components:
  schemas:
    AbsenceMonthOut:
      type: object
      properties:
        department:
          type: string
        days:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        previous_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
      required:
      - days
      - department
      - previous_days
    AccountBriefOut:
      type: object
      properties:
        public_id:
          type: string
        name:
          type: string
        email:
          type: string
      required:
      - email
      - name
      - public_id
    AccountCreateInRequest:
      type: object
      description: Either `employee` (the public id of an employee without account),
        or `email` and `full_name`.
      properties:
        email:
          type: string
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        employee:
          type: string
          format: uuid
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignableRoleEnum'
    AccountCreatedOut:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountOut'
        temporary_password:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - account
      - expires_at
      - temporary_password
    AccountDetailOut:
      type: object
      description: The Account page (UI 9.4).
      properties:
        public_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/AccountStateEnum'
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        has_employee:
          type: boolean
          readOnly: true
        role_assignments:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentOut'
        previous_login_at:
          type: string
          format: date-time
          nullable: true
        failed_attempts:
          type: integer
        locked_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          nullable: true
          readOnly: true
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventOut'
          readOnly: true
        can_enable:
          type: boolean
          readOnly: true
      required:
      - can_enable
      - created_at
      - created_by
      - email
      - failed_attempts
      - has_employee
      - last_login_at
      - locked_until
      - name
      - previous_login_at
      - public_id
      - recent_events
      - role_assignments
      - roles
      - state
    AccountOut:
      type: object
      description: One row of the Accounts page (UI 9.2). Takes a User instance.
      properties:
        public_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/AccountStateEnum'
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        has_employee:
          type: boolean
          readOnly: true
      required:
      - email
      - has_employee
      - last_login_at
      - name
      - public_id
      - roles
      - state
    AccountStateEnum:
      enum:
      - active
      - awaiting_first_sign_in
      - locked
      - disabled
      type: string
      description: |-
        * `active` - active
        * `awaiting_first_sign_in` - awaiting_first_sign_in
        * `locked` - locked
        * `disabled` - disabled
    AccountsAttentionOut:
      type: object
      properties:
        locked:
          type: array
          items:
            $ref: '#/components/schemas/AccountBriefOut'
        awaiting_first_sign_in:
          type: array
          items:
            $ref: '#/components/schemas/AccountBriefOut'
        temp_expired:
          type: array
          items:
            $ref: '#/components/schemas/AccountBriefOut'
        employees_without_account:
          type: array
          items:
            $ref: '#/components/schemas/AccountBriefOut'
      required:
      - awaiting_first_sign_in
      - employees_without_account
      - locked
      - temp_expired
    AdjustmentInRequest:
      type: object
      properties:
        kind:
          type: string
          minLength: 1
          description: opening or adjustment
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        effective_date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
      required:
      - amount
      - effective_date
      - kind
      - reason
    AmendmentInRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AmendmentKindEnum'
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        starts_at_midday:
          type: boolean
          default: false
        ends_at_midday:
          type: boolean
          default: false
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        reason:
          type: string
          default: ''
          maxLength: 2000
      required:
      - kind
    AmendmentKindEnum:
      enum:
      - cancel
      - change
      type: string
      description: |-
        * `cancel` - Cancel
        * `change` - Change
    AmendmentStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    ApprovalItemOut:
      type: object
      properties:
        step_id:
          type: integer
        request:
          $ref: '#/components/schemas/RequestOut'
        waiting_since:
          type: string
          format: date-time
          nullable: true
        via_delegation_from:
          type: string
          nullable: true
        decision_context:
          $ref: '#/components/schemas/DecisionContextOut'
      required:
      - decision_context
      - request
      - step_id
      - via_delegation_from
      - waiting_since
    ApproverRuleEnum:
      enum:
      - line_manager
      - hr_role
      - named_person
      type: string
      description: |-
        * `line_manager` - Line manager
        * `hr_role` - HR role
        * `named_person` - Named person
    ArchiveInRequest:
      type: object
      properties:
        leaving_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - leaving_date
      - reason
    ArchiveItemOut:
      type: object
      properties:
        label:
          type: string
        link:
          type: string
      required:
      - label
      - link
    ArchivePreviewOut:
      type: object
      properties:
        has_account:
          type: boolean
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveItemOut'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveSectionOut'
      required:
      - has_account
      - reports
      - sections
    ArchiveSectionOut:
      type: object
      properties:
        key:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveItemOut'
      required:
      - items
      - key
    AssignableRoleEnum:
      enum:
      - hr
      - exec
      - sysadmin
      type: string
      description: |-
        * `hr` - hr
        * `exec` - exec
        * `sysadmin` - sysadmin
    AuditCategoryEnum:
      enum:
      - business
      - security
      type: string
      description: |-
        * `business` - Business
        * `security` - Security
    AuditEventOut:
      type: object
      properties:
        id:
          type: integer
        at:
          type: string
