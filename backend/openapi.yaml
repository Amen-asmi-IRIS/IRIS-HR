      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleInRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailOut'
          description: ''
  /api/v1/accounts/{public_id}/roles/{role}:
    delete:
      operationId: accounts_role_remove
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: role
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailOut'
          description: ''
  /api/v1/accounts/{public_id}/unlock:
    post:
      operationId: accounts_unlock
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailOut'
          description: ''
  /api/v1/accounts/candidates:
    get:
      operationId: accounts_candidates
      description: Employees who have no account yet (empty until plan 02 provides
        the employee directory).
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateOut'
          description: ''
  /api/v1/admin/status:
    get:
      operationId: admin_status
      tags:
      - admin
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOut'
          description: ''
  /api/v1/amendments/{public_id}/withdraw:
    post:
      operationId: amendments_withdraw
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - amendments
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailOut'
          description: ''
  /api/v1/approvals:
    get:
      operationId: approvals_list
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -start_date
          - -waiting_since
          - start_date
          - waiting_since
        description: Sort order; the list's own order when absent. A leading minus
          sign means descending.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: 25 by default, 100 at most.'
      - in: query
        name: queue
        schema:
          type: string
          enum:
          - certificates
          - hr
          - mine
          - stuck
      - in: query
        name: type
        schema:
          type: string
        description: Comma-separated type codes
      tags:
      - approvals
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalItemOut'
          description: ''
  /api/v1/attachments/{public_id}/download:
    get:
      operationId: attachments_download
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/audit/business:
    get:
      operationId: audit_business_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: object_id
        schema:
          type: string
          minLength: 1
      - in: query
        name: object_type
        schema:
          type: string
          minLength: 1
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -action
          - -at
          - action
          - at
        description: Sort order; `-at` when absent. A leading minus sign means descending.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: 25 by default, 100 at most.'
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - audit
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventOut'
          description: ''
  /api/v1/audit/business/export:
    get:
      operationId: audit_business_export
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: object_id
        schema:
          type: string
          minLength: 1
      - in: query
        name: object_type
        schema:
          type: string
          minLength: 1
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -action
          - -at
          - action
          - at
        description: Sort order; `-at` when absent. A leading minus sign means descending.
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - audit
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/audit/security:
    get:
      operationId: audit_security_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: object_id
        schema:
          type: string
          minLength: 1
      - in: query
        name: object_type
        schema:
