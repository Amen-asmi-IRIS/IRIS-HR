openapi: 3.0.3
info:
  title: IRIS HR API
  version: '1'
  description: Internal API of the IRIS HR platform. Errors are problem details (application/problem+json).
paths:
  /api/v1/accounts:
    get:
      operationId: accounts_list
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -email
          - -last_login_at
          - -name
          - email
          - last_login_at
          - name
        description: Sort order; `email` when absent. A leading minus sign means descending.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Items per page: 25 by default, 100 at most.'
      - in: query
        name: role
        schema:
          enum:
          - hr
          - exec
          - sysadmin
          type: string
          minLength: 1
        description: |-
          * `hr` - hr
          * `exec` - exec
          * `sysadmin` - sysadmin
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: state
        schema:
          enum:
          - active
          - awaiting_first_sign_in
          - locked
          - disabled
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `awaiting_first_sign_in` - awaiting_first_sign_in
          * `locked` - locked
          * `disabled` - disabled
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountOut'
          description: ''
    post:
      operationId: accounts_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreateInRequest'
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedOut'
          description: ''
  /api/v1/accounts/{public_id}:
    get:
      operationId: accounts_detail
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailOut'
          description: ''
  /api/v1/accounts/{public_id}/disable:
    post:
      operationId: accounts_disable
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailOut'
          description: ''
  /api/v1/accounts/{public_id}/enable:
    post:
      operationId: accounts_enable
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
